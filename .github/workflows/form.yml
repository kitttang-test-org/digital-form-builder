# This is a basic workflow that is automatically triggered

name: Form only workflow

# Controls when the action will run. Workflow runs automatically when the form folder is updated
on:
  push:
    branches:
      - v2

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  check_and_greet:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      FORM_FOLDER: 'runner/src/server/forms/'
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Runs a check for the folder then send a greeting using the runners shell
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        fetch-depth: 0

    - name: Check file paths
      id: check_files
      run: |
        NON_FORM_FILES=$(git diff --name-only HEAD^ HEAD -- ":(exclude)${{ env.FORM_FOLDER }}" | wc -l)
        echo "Checking changed files: ${{ steps.changed_files.outputs.all_changed_files }}"

        if [ "$NON_FORM_FILES" -eq 0 ]; then
          echo "Only form changes found, able to deploy"
          FORM_ONLY="true"
        else
          echo "Non-form changes found, do not deploy"
          FORM_ONLY="false"
        fi
  
        echo "form_only=$FORM_ONLY" >> "$GITHUB_OUTPUT"
  
    - name: Send greeting
      if: steps.check_files.outputs.form_only == 'true'
      run: echo "Hello World"
