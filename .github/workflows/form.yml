# This is a basic workflow that is automatically triggered

name: Form only workflow

# Controls when the action will run. Workflow runs automatically when the form folder is updated
on:
  push:
    branches:
      - v2

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "greet"
  check_and_greet:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    env:
      FORMS_FOLDER: 'runner/src/server/forms/'
    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
    # Runs a check for the folder then send a greeting using the runners shell
    - name: Checkout
      uses: actions/checkout@v4
      with: 
        fetch-depth: 0

    - name: Get all changed files
      id: changed_files
      uses: tj-actions/changed-files@v44

    - name: Check file paths
      id: check_files
      run: |
        FORM_ONLY="true"
        echo "Checking changed files: ${{ steps.changed_files.outputs.all_changed_files }}"

        for file in ${{ steps.changed_files.outputs.all_changed_files }}; do
          if ! [[ "$file" == "${{ env.FORMS_FOLDER }}"* ]]; then
            echo "Non-form change: $file, do not deploy"
            FORM_ONLY="false"
            break;
          else
            echo "Form change: $file"
          fi
        done

        echo "form_only=$FORM_ONLY" >> "$GITHUB_OUTPUT"
  
    - name: Send greeting
      if: steps.check_files.outputs.form_only == '"rue"
      run: echo "Hello World"
